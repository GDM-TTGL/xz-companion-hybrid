name: XZ Companion Hybrid - Android ARM64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ANDROID_ABI: arm64-v8a
      BUILDENV_BASEPATH: /home/runner/buildenv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static integration verification
        run: |
          echo "===> Ejecutando verificacion estatica de integracion XZ..."
          python3 tools/xz_check.py

      - name: Free disk space on runner
        run: |
          echo "===> Liberando espacio en disco para el entorno de compilacion Mixxx..."
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo rm -rf /home/packer
          sudo rm -rf /opt/az
          sudo rm -rf /opt/google
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/vcpkg
          df -h /

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK tools
        run: |
          echo "===> Verificando Android SDK..."
          if [ -z "${ANDROID_HOME}" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"

          # Asegurar que sdkmanager este disponible para root y usuario
          sudo ln -sf "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" /usr/local/bin/sdkmanager
          sudo ln -sf "${ANDROID_HOME}/platform-tools/adb" /usr/local/bin/adb

          echo "Aceptando licencias del Android SDK..."
          yes | sdkmanager --licenses || true

          echo "Instalando plataformas y NDK oficial..."
          sdkmanager "platforms;android-35" "platform-tools" "build-tools;35.0.0" "ndk;27.2.12479018"

          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}" >> "${GITHUB_ENV}"
          echo "NDK_ROOT=${ANDROID_NDK_HOME}" >> "${GITHUB_ENV}"

      - name: Install system build dependencies and Linux/XCB packages
        run: |
          echo "===> Instalando dependencias nativas del sistema Linux y bibliotecas XCB/Qt..."
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ccache \
            cmake \
            ninja-build \
            make \
            build-essential \
            pkg-config \
            python3-jinja2 \
            unzip \
            file \
            linux-libc-dev \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libltdl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxi-dev \
            libxrender-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-x11-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libxcb-xinerama0 \
            libxcb-xinerama0-dev \
            libxcb-icccm4 \
            libxcb-icccm4-dev \
            libxcb-image0 \
            libxcb-image0-dev \
            libxcb-keysyms1 \
            libxcb-keysyms1-dev \
            libxcb-randr0 \
            libxcb-randr0-dev \
            libxcb-render-util0 \
            libxcb-render-util0-dev \
            libxcb-shape0 \
            libxcb-shape0-dev \
            libxcb-sync1 \
            libxcb-sync-dev \
            libxcb-xfixes0 \
            libxcb-xfixes0-dev \
            libxcb-xkb1 \
            libxcb-xkb-dev \
            libxcb-xinput0 \
            libxcb-xinput-dev \
            libxcb-glx0-dev \
            libxcb-util-dev

          # Exportar variables de entorno de Mixxx buildenv
          source tools/android_buildenv.sh env

      - name: Pre-fetch and extract Mixxx prebuilt buildenv
        run: |
          echo "===> Preparando dependencias precompiladas de Mixxx..."
          source tools/android_buildenv.sh env
          mkdir -p "${BUILDENV_BASEPATH}"
          ZIP_FILE="${BUILDENV_BASEPATH}/${BUILDENV_NAME}.zip"
          EXTRACT_DIR="${BUILDENV_BASEPATH}/${BUILDENV_NAME}"

          if [ ! -d "${EXTRACT_DIR}" ]; then
            if [ ! -f "${ZIP_FILE}" ]; then
              echo "Descargando ${BUILDENV_URL}..."
              curl -fsSL -o "${ZIP_FILE}" "${BUILDENV_URL}"
            fi
            echo "Verificando SHA256 del buildenv..."
            echo "${BUILDENV_SHA256}  ${ZIP_FILE}" | sha256sum -c -
            echo "Descomprimiendo en ${EXTRACT_DIR}..."
            unzip -q "${ZIP_FILE}" -d "${BUILDENV_BASEPATH}"
          fi
          echo "Buildenv verificado y listo en ${EXTRACT_DIR}."

      - name: Check qmlimportscanner and Qt host tools dependencies with ldd
        run: |
          echo "===> Verificando dependencias con ldd para herramientas host de Qt..."
          source tools/android_buildenv.sh env

          # Localizar ejecutables host de Qt en el buildenv
          QT_TOOLS=$(find "${BUILDENV_BASEPATH}" -type f \( -name "qmlimportscanner" -o -name "moc" -o -name "rcc" -o -name "qmltyperegistrar" \) 2>/dev/null)
          echo "Herramientas Qt detectadas:"
          echo "${QT_TOOLS}"

          MISSING_LIBS=0
          for tool in ${QT_TOOLS}; do
            if file "${tool}" | grep -q "ELF 64-bit"; then
              echo "===================================================="
              echo "Inspeccionando bibliotecas con ldd para: ${tool}"
              ldd "${tool}"
              if ldd "${tool}" | grep -i "not found"; then
                echo "ALERTA: Dependencias faltantes encontradas en ${tool}!"
                MISSING_LIBS=$((MISSING_LIBS + 1))
              fi
            fi
          done

          if [ ${MISSING_LIBS} -gt 0 ]; then
            echo "ERROR: Existen bibliotecas compartidas faltantes para ejecutar las herramientas de Qt."
            exit 1
          fi

          echo "OK: Todas las herramientas Qt del host tienen sus dependencias compartidas completas."

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ runner.os }}-ccache-android-arm64-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-android-arm64-

      - name: Generate temporary debug keystore
        run: |
          echo "===> Generando debug keystore para firma de pruebas..."
          mkdir -p /home/runner/keystore
          keytool -genkey -v -keystore /home/runner/keystore/xz-debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=XZ Companion Debug,OU=Testing,O=XZCompanion,C=US"

      - name: Configure CMake
        run: |
          echo "===> Configurando CMake para Android ARM64..."
          mkdir -p build
          cd build
          cmake \
            -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_ABI=arm64-v8a \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_DEFAULT_HOST_TRIPLET=x64-linux-release \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBULK=ON \
            -DQT6=ON \
            -DQML=ON \
            -DHID=ON \
            -DBATTERY=ON \
            -DBROADCAST=ON \
            -DDOWNLOAD_MANUAL=ON \
            -DKEYFINDER=ON \
            -DLILV=ON \
            -DOPUS=ON \
            -DQTKEYCHAIN=ON \
            -DVINYLCONTROL=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            -DWARNINGS_FATAL=ON \
            -DDEBUG_ASSERTIONS_FATAL=OFF \
            -DQT_ANDROID_SIGN_APK=ON \
            -DQT_ANDROID_KEYSTORE_PATH=/home/runner/keystore/xz-debug.keystore \
            -DQT_ANDROID_KEYSTORE_STORE_PASS=android \
            -DQT_ANDROID_KEYSTORE_ALIAS=androiddebugkey \
            -DQT_ANDROID_KEYSTORE_KEY_PASS=android \
            ..

      - name: Build Mixxx Android target (APK)
        run: |
          set -o pipefail
          echo "===> Compilando Mixxx..."
          cd build
          cmake --build . --config RelWithDebInfo --parallel "$(nproc)" 2>&1 | tee build_output.log

          echo "===> Verificando y ejecutando target de empaquetado APK..."
          if cmake --build . --target help 2>/dev/null | grep -qE "(^|[[:space:]])apk([[:space:]]|$)"; then
            echo "Ejecutando target explicito: apk"
            cmake --build . --target apk 2>&1 | tee -a build_output.log
          elif cmake --build . --target help 2>/dev/null | grep -qE "(^|[[:space:]])mixxx_make_apk([[:space:]]|$)"; then
            echo "Ejecutando target explicito: mixxx_make_apk"
            cmake --build . --target mixxx_make_apk 2>&1 | tee -a build_output.log
          elif cmake --build . --target help 2>/dev/null | grep -qE "(^|[[:space:]])mixxx_apk([[:space:]]|$)"; then
            echo "Ejecutando target explicito: mixxx_apk"
            cmake --build . --target mixxx_apk 2>&1 | tee -a build_output.log
          fi

      - name: Package and sign APK
        if: success()
        run: |
          echo "===> Verificando APK generado..."
          mkdir -p artifacts

          # Buscar APKs generados
          FOUND_APKS=$(find build -name "*.apk" -type f)
          echo "APKs encontrados en el árbol de compilación:"
          echo "${FOUND_APKS}"

          if [ -z "${FOUND_APKS}" ]; then
            echo "ERROR: No se encontró ningún APK tras la compilación."
            exit 1
          fi

          # Tomar el APK final (release o debug)
          TARGET_APK=""
          for apk in ${FOUND_APKS}; do
            if [[ "$apk" == *"android-build"* ]]; then
              TARGET_APK="$apk"
            fi
          done

          if [ -z "$TARGET_APK" ]; then
            TARGET_APK=$(echo "${FOUND_APKS}" | head -n 1)
          fi

          echo "Procesando APK objetivo: ${TARGET_APK}"

          # Comprobar firma con apksigner
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools/35.0.0" -name apksigner | head -n 1)
          ZIPALIGN=$(find "${ANDROID_HOME}/build-tools/35.0.0" -name zipalign | head -n 1)

          FINAL_APK="artifacts/XZCompanion-Hybrid-v0.1-arm64-v8a.apk"
          cp "${TARGET_APK}" "${FINAL_APK}"

          if ! ${APKSIGNER} verify "${FINAL_APK}" 2>/dev/null; then
            echo "APK no firmado detectado. Firmando con apksigner y debug keystore..."
            ${ZIPALIGN} -v -p 4 "${TARGET_APK}" artifacts/aligned.apk || cp "${TARGET_APK}" artifacts/aligned.apk
            ${APKSIGNER} sign --ks /home/runner/keystore/xz-debug.keystore \
              --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --out "${FINAL_APK}" artifacts/aligned.apk
            rm -f artifacts/aligned.apk
          fi

          echo "Verificando firma final de ${FINAL_APK}:"
          ${APKSIGNER} verify --verbose "${FINAL_APK}"

          ls -lh artifacts/

      - name: Save ccache stats
        if: always()
        run: |
          ccache --show-stats || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xz-android-build-log
          path: build/build_output.log
          if-no-files-found: ignore

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XZCompanion-Hybrid-v0.1-arm64-v8a-APK
          path: artifacts/XZCompanion-Hybrid-v0.1-arm64-v8a.apk
          if-no-files-found: error
